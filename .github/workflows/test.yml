name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash -n tools/update-fathi.sh
      - run: bash tools/test-updater.sh
        if: runner.os == 'Linux'
      - name: Parse PowerShell updater
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/update-fathi.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors; exit 1 }
      - name: Test Windows API-404 fallback without installing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-update-metadata.ps1
      - name: Run browser identity and live interception audits
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./node_modules/electron/dist/electron.exe -ArgumentList '.', '--fathi-e2e', '--fathi-identity-audit', '--fathi-intercept-audit' -PassThru -Wait
          Get-Content e2e-result.txt
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - name: Preserve browser audit reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-windows
          path: |
            e2e-report.json
            e2e-result.txt
            e2e-*.png
          if-no-files-found: ignore
