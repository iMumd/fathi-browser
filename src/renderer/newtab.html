<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src https: fathi: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>New Tab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nt-card: #FFFFFF;
      --nt-border: #E3E5E9;
      --nt-text: #15171A;
      --nt-muted: #676D76;
      --nt-faint: #9AA0A8;
      --nt-field: #F2F3F6;
      --nt-accent: #4E7FA8;
      --nt-accent-text: #FFFFFF;
      --nt-chip: rgba(12, 14, 17, .34);
      --nt-chip-border: rgba(255, 255, 255, .22);
    }

    html[data-theme="dark"] {
      --nt-card: #101112;
      --nt-border: #24262A;
      --nt-text: #E7E9EC;
      --nt-muted: #8B9098;
      --nt-faint: #63686F;
      --nt-field: #17191B;
      --nt-accent: #8FB4D6;
      --nt-accent-text: #0A0E12;
      --nt-chip: rgba(8, 9, 10, .52);
      --nt-chip-border: rgba(255, 255, 255, .14);
    }

    html, body {
      height: 100%;
      font-family: ui-sans-serif, "Segoe UI Variable Text", "Segoe UI", "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
      color: #fff;
      overflow: hidden;
      background: #0A0B0C;
      -webkit-font-smoothing: antialiased;
    }

    #bg-base { position: fixed; inset: 0; background: #ECEEF1; }
    html[data-theme="dark"] #bg-base { background: #0A0B0C; }

    #bg {
      position: fixed; inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity .6s ease;
      opacity: 0;
      transform: scale(1.01);
    }
    #bg.ready { opacity: 1; }

    #dim {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(6,8,10,.22) 0%, rgba(6,8,10,.40) 55%, rgba(6,8,10,.56) 100%);
    }

    #stage {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 128px;
      gap: 22px;
    }

    #brand-mark {
      position: fixed;
      top: 22px;
      inset-inline-start: 24px;
      display: flex;
      align-items: center;
      gap: 9px;
      user-select: none;
    }
    #brand-mark img { width: 24px; height: 24px; border-radius: 3px; }
    #brand-mark .name {
      font-size: 11.5px; font-weight: 650; letter-spacing: 1.6px; text-transform: uppercase;
      color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.4);
    }
