
  <!-- -------------------------------- FLOW ------------------------------- -->
  <section id="pane-flow" class="ix-pane">
    <div id="net-summary" class="net-summary">
      <div class="ns-cell"><b id="net-total">0</b><span data-i18n="flow.requests">requests</span></div>
      <div class="ns-cell"><b id="net-bytes">0 B</b><span data-i18n="flow.transferred">transferred</span></div>
      <div class="ns-cell"><b id="net-avg">0 ms</b><span data-i18n="flow.avg">avg</span></div>
      <div class="ns-cell"><b id="net-fail">0</b><span data-i18n="flow.failed">failed</span></div>
    </div>

    <div class="ix-filter-wrap">
      <input id="net-filter" class="ix-filter" type="text" spellcheck="false" dir="ltr"
             data-i18n-ph="flow.filter" placeholder="Filter URL, method or status" />
    </div>

    <div class="ix-body">
      <div id="net-list" class="net-list"></div>
      <div id="net-detail" class="net-detail hidden"></div>
    </div>

    <footer class="ix-foot">
      <select id="net-scope" class="mini-select">
        <option value="tab" data-i18n="flow.thisTab">This tab</option>
        <option value="all" data-i18n="flow.allTabs">All tabs</option>
      </select>
      <select id="net-format" class="mini-select">
        <option value="har">HAR</option>
        <option value="xml">XML</option>
        <option value="json">JSON</option>
        <option value="csv">CSV</option>
      </select>
      <button class="btn sm primary" id="net-save" data-i18n="flow.save">Save</button>
      <button class="btn sm" id="net-clear" data-i18n="flow.clear">Clear</button>
    </footer>
  </section>

  <!-- ----------------------------- INTERCEPT ----------------------------- -->
  <section id="pane-intercept" class="ix-pane hidden">
    <div class="ix-toolbar">
      <div class="ix-title">
        <span class="ix-led"></span>
        <span id="ix-state-text">Off</span>
      </div>
      <div class="switch" id="ix-toggle" title="Pause requests"></div>
    </div>

    <div class="ix-filter-wrap">
      <input id="ix-filter" class="ix-filter" type="text" spellcheck="false" dir="ltr"
             data-i18n-ph="intercept.filter" placeholder="Filter by host or path, e.g. api.example.com" />
    </div>
