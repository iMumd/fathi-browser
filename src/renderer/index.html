
    <div class="ix-body">
      <div id="ix-list"></div>

      <div id="ix-detail" class="hidden">
        <div class="field">
          <label data-i18n="intercept.url">URL</label>
          <input id="ix-url" type="text" spellcheck="false" dir="ltr" />
        </div>
        <div class="ix-two">
          <div class="field">
            <label data-i18n="intercept.method">Method</label>
            <input id="ix-method" type="text" spellcheck="false" dir="ltr" />
          </div>
          <div class="field">
            <label data-i18n="intercept.type">Type</label>
            <input id="ix-type" type="text" readonly />
          </div>
        </div>
        <div class="field">
          <label data-i18n="intercept.headers">Headers</label>
          <textarea id="ix-headers" spellcheck="false" dir="ltr"></textarea>
        </div>
        <div class="field" id="ix-body-field">
          <label data-i18n="intercept.body">Body</label>
          <textarea id="ix-body-text" spellcheck="false" dir="ltr"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="ix-forward" data-i18n="intercept.forward">Forward</button>
          <button class="btn danger" id="ix-drop" data-i18n="intercept.drop">Drop</button>
          <button class="btn ghost" id="ix-back" data-i18n="intercept.back">Back</button>
        </div>
        <div class="btn-row ix-code-row">
          <select id="ix-code-lang" class="mini-select">
            <option value="curl">cURL</option>
            <option value="python">Python · requests</option>
            <option value="python-http">Python · http.client</option>
            <option value="php">PHP · cURL</option>
            <option value="node">Node.js · fetch</option>
            <option value="powershell">PowerShell</option>
            <option value="go">Go</option>
            <option value="raw">Raw HTTP</option>
          </select>
          <button class="btn sm" id="ix-code-copy" data-i18n="flow.copyCode">Copy code</button>
          <button class="btn sm" id="ix-copy-curl">cURL</button>
        </div>
      </div>
    </div>
